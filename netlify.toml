[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/profesional*"
  to = "/profesional/index.html"
  status = 200

[[redirects]]
  from = "/amedida*"
  to = "/amedida/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
