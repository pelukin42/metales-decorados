[build]
  publish = "amedida"
  command = ""

[[redirects]]
  from = "/amedida"
  to = "/"
  status = 301

[[redirects]]
  from = "/amedida/*"
  to = "/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
